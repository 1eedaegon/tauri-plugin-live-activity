[package]
name = "tauri-plugin-live-activity"
version = "0.3.0"
description = "Tauri 2 plugin for iOS Live Activities (ActivityKit and Dynamic Island) and Android Live Updates with ongoing notification fallback"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/1eedaegon/tauri-plugin-live-activity"
readme = "README.md"
keywords = ["tauri", "live-activities", "activitykit", "notifications", "android"]
categories = ["api-bindings", "gui", "os::android-apis"]
links = "tauri-plugin-live-activity"
include = [
    "/src/**", "/build.rs", "/permissions/**",
    "/ios/Package.swift", "/ios/Sources/**",
    "/android/build.gradle.kts", "/android/consumer-rules.pro", "/android/src/main/**",
    "/templates/ios/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE*", "/README.md",
    "/docs/ios-integration.md", "/docs/android-integration.md",
    "/tests/contract.rs", "/tests/fixtures/requests.json", "/tests/fixtures/layout-requests.json",
]

[dependencies]
tauri = { version = "2.12.5", default-features = false }
serde = { version = "1", features = ["derive"] }
# Correctly rounded number parsing, so that a value arrives as JavaScript sent it.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
liveupdate = { version = "0.1.0-alpha.1", git = "https://github.com/1eedaegon/liveupdate-rs", rev = "3b797bbfeb7aef29253ff0cb017bb7b07ee0bd46" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["test"] }
