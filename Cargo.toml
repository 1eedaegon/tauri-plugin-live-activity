[package]
name = "tauri-plugin-live-activity"
version = "0.15.1"
description = "Tauri 2 plugin for iOS Live Activities (ActivityKit and Dynamic Island) and Android Live Updates with ongoing notification fallback"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/1eedaegon/tauri-plugin-live-activity"
homepage = "https://1eedaegon.github.io/tauri-plugin-live-activity/"
documentation = "https://docs.rs/tauri-plugin-live-activity"
readme = "README.md"
keywords = ["tauri", "live-activities", "dynamic-island", "live-updates", "activitykit"]
categories = ["api-bindings", "gui", "os", "os::android-apis"]
links = "tauri-plugin-live-activity"
include = [
    "/src/**", "/build.rs", "/permissions/**",
    "/android/build.gradle.kts", "/android/consumer-rules.pro", "/android/src/main/**",
    "/Cargo.toml", "/Cargo.lock", "/LICENSE*", "/README.md",
    "/docs/ios-integration.md", "/docs/android-integration.md",
    "/tests/contract.rs",
]

[features]
# liveupdate's push path on Android: a data message from the app's server starts, updates or ends a layout activity
# while the app may not run. Turn it on together with the app's messaging service, which calls
# `LiveUpdatePush.handle`, and the manifest's meta-data that names the app's library (docs/android-integration.md).
# Off, the capability `push` stays `unsupported` on Android and no push entry is in the app's library.
android-push = ["liveactivity/android-push"]

[dependencies]
# The contract, its checks and the iOS and Android backends.
liveactivity = "0.16.0"
tauri = { version = "2.12.5", default-features = false }
serde = { version = "1", features = ["derive"] }
# Correctly rounded number parsing, so that a value arrives as JavaScript sent it.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[dev-dependencies]
# Its test kit: the memory backend and the contract's conformance checks, for the tests of layers (TP-RUST-7).
liveactivity = { version = "0.16.0", features = ["testkit"] }
tauri = { version = "2.12.5", default-features = false, features = ["test"] }
