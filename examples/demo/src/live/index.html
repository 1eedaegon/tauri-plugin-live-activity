<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live editing</title>
    <style>
      html { min-height: 100%; background: #fbf9f4; }
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; color: #2e3229; }
      .live { padding: 24px; }
      .live h1 { font-size: 1.4rem; margin: 0 0 12px; }
      .live code { font-size: 0.85rem; }
      .live dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; }
      .live dt { color: #6b6f63; }
      .live dd { margin: 0; font-variant-numeric: tabular-nums; }
      .live [role="alert"] { color: #9c3b26; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
