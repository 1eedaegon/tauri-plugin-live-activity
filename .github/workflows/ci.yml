name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each commit on main gets a run of its own that nothing cancels: the Publish workflow
# needs a successful main run for the exact commit of a release tag.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts the push or pull request changed. Each job below runs only for its part, so a
  # change to docs alone ends here; the run still succeeds, as the release guard needs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      js: ${{ steps.areas.outputs.js }}
      ios: ${{ steps.areas.outputs.ios }}
      android: ${{ steps.areas.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          all() { for area in rust js ios android; do echo "$area=true" >> "$GITHUB_OUTPUT"; done; echo "every part: $1"; }
          if [ "$EVENT" = workflow_dispatch ]; then all "run by hand"; exit 0; fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then all "no base to compare"; exit 0; fi
          if ! files=$(git diff --name-only "$BASE" "$HEAD"); then all "git diff failed"; exit 0; fi
          printf '%s\n' "$files"
          # The workflows and the fixtures every language reads concern every part.
          if grep -qE '^(\.github/workflows/|tests/fixtures/|contracts/)' <<< "$files"; then all "workflow or shared fixtures"; exit 0; fi
          area() { grep -qE "$2" <<< "$files" && echo "$1=true" >> "$GITHUB_OUTPUT" || echo "$1=false" >> "$GITHUB_OUTPUT"; }
          area rust '^(src/|build\.rs$|Cargo\.(toml|lock)$|permissions/|tests/[^/]+\.rs$|examples/demo/src-tauri/)'
          area js '^(guest-js/|cli/|tools/|tests/[^/]+\.mjs$|tests/release/|package(-lock)?\.json$|tsconfig\.json$|examples/demo/)'
          # iOS is the activitykit crate and the plugin's Rust on it (Cargo.lock holds activitykit's version), setup, and
          # what the demo on the simulator is built from.
          area ios '^(src/|build\.rs$|Cargo\.(toml|lock)$|cli/|guest-js/|package(-lock)?\.json$|tests/ios/|examples/demo/)'
          area android '^(android/|tests/android/|Cargo\.(toml|lock)$)'
          cat "$GITHUB_OUTPUT"
  # The specification against the tests, for every change: docs/spec.md may change alone.
  spec:
    name: Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: sh tools/spec-coverage.sh
      - run: node --test tests/ci.test.mjs
  contracts:
    name: Rust, TypeScript and iOS
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15-intel
    env:
      RUST: ${{ needs.changes.outputs.rust }}
      JS: ${{ needs.changes.outputs.js }}
      IOS: ${{ needs.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.JS == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: env.RUST == 'true' || env.IOS == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy,llvm-tools-preview --target x86_64-apple-ios,aarch64-apple-ios
      - if: env.RUST == 'true' || env.IOS == 'true'
        run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RUST == 'true' || env.IOS == 'true'
        with:
          workspaces: |
            . -> target
            examples/demo/src-tauri -> target
      - if: env.JS == 'true'
        run: npm ci
      - if: env.JS == 'true'
        run: npm test && npm run typecheck && npm run build:demo
      - name: Test release guards
        if: env.JS == 'true'
        run: node --test --experimental-test-coverage --test-coverage-include=tools/release-guard.mjs --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 tests/release/release-guard.test.mjs
      - if: env.RUST == 'true'
        run: cargo fmt --all -- --check
      - if: env.RUST == 'true'
        run: cargo fmt --manifest-path examples/demo/src-tauri/Cargo.toml -- --check
      - if: env.RUST == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: env.RUST == 'true'
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: env.RUST == 'true'
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 80
      - if: env.RUST == 'true'
        run: cargo test --locked --manifest-path examples/demo/src-tauri/Cargo.toml
      # The plugin's iOS code on activitykit: checked for the device without Swift, then built for the simulator, which
      # builds activitykit's Swift bridge into the library.
      - if: env.IOS == 'true'
        run: ACTIVITYKIT_SKIP_SWIFT=1 cargo clippy --locked --target aarch64-apple-ios --lib -- -D warnings
      - if: env.IOS == 'true'
        run: cargo build --locked --target x86_64-apple-ios --lib
      - if: env.JS == 'true'
        run: npm pack --dry-run
      - if: env.RUST == 'true'
        run: cargo package --locked
  # The demo app on an iOS Simulator (tests/ios/run.sh). The built demo and UI tests are cached under a key of what they
  # are built from and the Xcode version, and an exact hit runs them with test-without-building. A pass is remembered
  # under its inputs, the runner image and the Xcode version, so the merge commit of a tested pull request skips the
  # suite; the job stays green either way.
  e2e:
    name: Demo on the iOS Simulator
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15-intel
    env:
      BUILD_DIR: ${{ github.workspace }}/.ios-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Xcode of the image, as activitykit's CI selects it.
      - name: Select Xcode
        id: xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          echo "version=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      - name: Inputs of the demo and the UI tests
        id: inputs
        run: echo "hash=${{ hashFiles('Cargo.toml', 'Cargo.lock', 'build.rs', 'src/**', 'guest-js/**', 'package-lock.json', 'tsconfig.json', 'examples/demo/**', 'tests/ios/**', '!examples/demo/src-tauri/target/**') }}" >> "$GITHUB_OUTPUT"
      - name: Earlier pass
        id: passed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-passed
          key: e2e-passed-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.xcode.outputs.version }}-${{ steps.inputs.outputs.hash }}
          lookup-only: true
      - if: steps.passed.outputs.cache-hit == 'true'
        run: echo "The suite passed for these inputs on $ImageOS $ImageVersion with ${{ steps.xcode.outputs.version }}; skipped."
      - name: Built demo and UI tests
        id: built
        if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-build
          key: ios-build-${{ env.ImageOS }}-${{ steps.xcode.outputs.version }}-${{ steps.inputs.outputs.hash }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.passed.outputs.cache-hit != 'true' && steps.built.outputs.cache-hit != 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.passed.outputs.cache-hit != 'true' && steps.built.outputs.cache-hit != 'true'
        run: |
          npm ci
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-apple-ios
          rustup default 1.99.1
          brew install xcodegen
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.passed.outputs.cache-hit != 'true' && steps.built.outputs.cache-hit != 'true'
        with:
          workspaces: examples/demo/src-tauri -> target
          key: ios-simulator
      - name: End to end on the simulator
        if: steps.passed.outputs.cache-hit != 'true'
        env:
          REUSE: ${{ steps.built.outputs.cache-hit == 'true' && '1' || '' }}
          OUTPUT: ${{ github.workspace }}/tests/ios/output
        run: sh tests/ios/run.sh
      - if: always() && steps.passed.outputs.cache-hit != 'true' && steps.built.outputs.cache-hit != 'true' && hashFiles('.ios-build/demo/live-activity-demo.app/Info.plist') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-build
          key: ios-build-${{ env.ImageOS }}-${{ steps.xcode.outputs.version }}-${{ steps.inputs.outputs.hash }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p .e2e-passed && date -u > .e2e-passed/passed
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-passed
          key: e2e-passed-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ steps.xcode.outputs.version }}-${{ steps.inputs.outputs.hash }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.passed.outputs.cache-hit != 'true'
        with:
          name: ios-simulator
          path: tests/ios/output
          if-no-files-found: ignore
  android:
    name: Android unit tests and lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: cargo fetch --locked
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: ./gradlew :live-activity:testDebugUnitTest :live-activity:lintDebug :live-activity:assembleDebugAndroidTest --no-daemon
        working-directory: tests/android
      - name: Verify Android minimum in the merged APK
        run: node tests/android/verify-min-sdk.mjs "$ANDROID_HOME/build-tools/37.0.0/aapt" android/build/outputs/apk/androidTest/debug/live-activity-debug-androidTest.apk
  desktop:
    name: Desktop contract (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
