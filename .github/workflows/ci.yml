name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retest:
        description: Run the simulator suites even when they passed for the same inputs
        type: boolean
        default: false
      # A hosted runner rebuilds the demo whenever the suites' inputs change (30 to 50 minutes), so a push or a pull
      # request does not run them: tests/ios/run.sh runs them on a Mac before the push.
      simulator:
        description: Run the two simulator suites
        type: boolean
        default: false

permissions:
  contents: read

# Each commit on main gets a run of its own that nothing cancels: the Publish workflow
# needs a successful main run for the exact commit of a release tag.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The tools of every job, pinned; the simulator jobs' keys name them (tests/ci/cache.sh).
env:
  TOOLCHAIN: 1.99.1
  XCODEGEN: 2.44.1
  XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
  NODE: '24'

jobs:
  # Which parts the push or pull request changed. Each job below runs only for its part, so a
  # change to docs alone ends here; the run still succeeds, as the release guard needs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      js: ${{ steps.areas.outputs.js }}
      ios: ${{ steps.areas.outputs.ios }}
      android: ${{ steps.areas.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          all() { for area in rust js ios android; do echo "$area=true" >> "$GITHUB_OUTPUT"; done; echo "every part: $1"; }
          if [ "$EVENT" = workflow_dispatch ]; then all "run by hand"; exit 0; fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then all "no base to compare"; exit 0; fi
          if ! files=$(git diff --name-only "$BASE" "$HEAD"); then all "git diff failed"; exit 0; fi
          printf '%s\n' "$files"
          # The workflows and the fixtures every language reads concern every part.
          if grep -qE '^(\.github/workflows/|tests/fixtures/|contracts/)' <<< "$files"; then all "workflow or shared fixtures"; exit 0; fi
          area() { grep -qE "$2" <<< "$files" && echo "$1=true" >> "$GITHUB_OUTPUT" || echo "$1=false" >> "$GITHUB_OUTPUT"; }
          area rust '^(src/|build\.rs$|Cargo\.(toml|lock)$|permissions/|tests/[^/]+\.rs$|examples/demo/src-tauri/)'
          # tests/jsx and tests/declarations hold the TypeScript that node tests compile.
          area js '^(guest-js/|cli/|tools/|tests/[^/]+\.mjs$|tests/(release|jsx|declarations)/|package(-lock)?\.json$|tsconfig\.json$|examples/demo/)'
          # iOS is what the simulator suites read, as tests/ci/cache.sh lists it: the plugin's Rust on activitykit
          # (Cargo.lock holds activitykit's version), the TypeScript API, setup, the tools of the demo's build, the demo,
          # the UI tests and the CI scripts.
          area ios '^(src/|build\.rs$|Cargo\.(toml|lock)$|permissions/|guest-js/|cli/|tools/|package(-lock)?\.json$|tsconfig\.json$|examples/demo/|tests/ios/|tests/ci/)'
          area android '^(android/|tests/android/|src/|build\.rs$|Cargo\.(toml|lock)$)'
          cat "$GITHUB_OUTPUT"
  # The specification against the tests, for every change: docs/spec.md may change alone.
  spec:
    name: Specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE }}
      - run: sh tools/spec-coverage.sh
      - run: node --test tests/spec-coverage.test.mjs tests/ci.test.mjs tests/ci-cache.test.mjs
  contracts:
    name: Rust, TypeScript and iOS
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15-intel
    env:
      RUST: ${{ needs.changes.outputs.rust }}
      JS: ${{ needs.changes.outputs.js }}
      IOS: ${{ needs.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node also for the Rust: the demo's Rust embeds its page, which build:demo makes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.JS == 'true' || env.RUST == 'true'
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - if: env.RUST == 'true' || env.IOS == 'true'
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy,llvm-tools-preview --target x86_64-apple-ios,aarch64-apple-ios && rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RUST == 'true' || env.IOS == 'true'
        with:
          workspaces: |
            . -> target
            examples/demo/src-tauri -> target
      - if: env.JS == 'true' || env.RUST == 'true'
        run: npm ci
      - if: env.JS == 'true'
        run: npm test && npm run typecheck && npm run build:demo
      - name: Test release guards
        if: env.JS == 'true'
        run: node --test --experimental-test-coverage --test-coverage-include=tools/release-guard.mjs --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 tests/release/release-guard.test.mjs
      - if: env.RUST == 'true'
        run: cargo fmt --all -- --check
      - if: env.RUST == 'true'
        run: cargo fmt --manifest-path examples/demo/src-tauri/Cargo.toml -- --check
      - if: env.RUST == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: env.RUST == 'true'
        with:
          tool: cargo-llvm-cov@0.9.1
      - if: env.RUST == 'true'
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 80
      - if: env.RUST == 'true'
        run: npm run build:demo && cargo test --locked --manifest-path examples/demo/src-tauri/Cargo.toml
      # The plugin's iOS code on activitykit: checked for the device without Swift, then built for the simulator, which
      # builds activitykit's Swift bridge into the library.
      - if: env.IOS == 'true'
        run: ACTIVITYKIT_SKIP_SWIFT=1 cargo clippy --locked --target aarch64-apple-ios --lib -- -D warnings
      - if: env.IOS == 'true'
        run: cargo build --locked --target x86_64-apple-ios --lib
      - if: env.JS == 'true'
        run: npm pack --dry-run
      - if: env.RUST == 'true'
        run: cargo package --locked
  # The demo app on an iOS Simulator (tests/ios/run.sh), built by `tauri ios build` (e2e) and by `tauri ios dev`
  # (e2e-dev). A suite skips when it already passed for the same inputs (tests/ci/cache.sh): the tracked files it reads,
  # Xcode, the runner image, the pinned tools and the simulator runtime. The record of a pass is an artifact, so the push
  # to main that merges a pull request finds the pass of the pull request's run. A skipped suite leaves the job green.
  e2e:
    name: Demo on the iOS Simulator
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.simulator && needs.changes.outputs.ios == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      BUILD_DIR: ${{ github.workspace }}/.ios-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Xcode of the image, as activitykit's CI selects it.
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Keys
        id: keys
        run: sh tests/ci/cache.sh keys simulator
      - name: Look for a pass of the suite
        id: passed
        if: ${{ !inputs.retest }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.keys.outputs.simulator }}
        run: sh tests/ci/cache.sh passed "$NAME"
      # The built demo and UI tests of these exact inputs: run.sh tests them without building.
      - name: Restore the built demo and UI tests
        id: products
        if: steps.passed.outputs.found != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-build
          key: ${{ steps.keys.outputs.products }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.passed.outputs.found != 'true' && steps.products.outputs.cache-hit != 'true'
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - if: steps.passed.outputs.found != 'true' && steps.products.outputs.cache-hit != 'true'
        run: npm ci && rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-apple-ios && rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.passed.outputs.found != 'true' && steps.products.outputs.cache-hit != 'true'
        with:
          workspaces: examples/demo/src-tauri -> target
          key: ios-simulator
          cache-on-failure: true
      - name: Install XcodeGen
        if: steps.passed.outputs.found != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: End to end on the simulator
        if: steps.passed.outputs.found != 'true'
        env:
          BUILD_KEY: ${{ steps.keys.outputs.products }}
          RUNTIME: ${{ steps.keys.outputs.runtime }}
          OUTPUT: ${{ runner.temp }}/ios-simulator
        run: sh tests/ios/run.sh
      # Saved once the build is complete, also when the tests then failed: a re-run tests the same products.
      - name: Check the build of the products
        id: built
        if: ${{ !cancelled() && steps.passed.outputs.found != 'true' && steps.products.outputs.cache-hit != 'true' }}
        env:
          KEY: ${{ steps.keys.outputs.products }}
        run: |
          if [ "$(cat .ios-build/build-key 2>/dev/null)" = "$KEY" ]; then
            echo complete=true >> "$GITHUB_OUTPUT"
          else
            echo "no complete build to save"
          fi
      - name: Save the built demo and UI tests
        if: ${{ !cancelled() && steps.built.outputs.complete == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-build
          key: ${{ steps.keys.outputs.products }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.passed.outputs.found != 'true'
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/ios-simulator/
          retention-days: 14
          if-no-files-found: ignore
      - name: Record the pass of the suite
        id: record
        if: steps.passed.outputs.found != 'true'
        run: sh tests/ci/cache.sh record simulator "$RUNNER_TEMP/ios-simulator/passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.record.outputs.recorded == 'true'
        with:
          name: ${{ steps.keys.outputs.simulator }}
          path: ${{ runner.temp }}/passed-simulator/
          retention-days: 90
          if-no-files-found: error
  # The demo that `tauri ios dev` builds, installs, launches and serves, with the tests that go through its page and the
  # one where Rust starts a layout (MODE=dev). Nothing of its build is cached: Tauri builds it in its own DerivedData.
  e2e-dev:
    name: Demo in tauri ios dev on the iOS Simulator
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.simulator && needs.changes.outputs.ios == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    # For the keys and the run alike: the record names the mode.
    env:
      MODE: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Keys
        id: keys
        run: sh tests/ci/cache.sh keys dev
      - name: Look for a pass of the suite
        id: passed
        if: ${{ !inputs.retest }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.keys.outputs.dev }}
        run: sh tests/ci/cache.sh passed "$NAME"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.passed.outputs.found != 'true'
        with:
          node-version: ${{ env.NODE }}
          cache: npm
      - if: steps.passed.outputs.found != 'true'
        run: npm ci && rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-apple-ios && rustup default "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.passed.outputs.found != 'true'
        with:
          workspaces: examples/demo/src-tauri -> target
          key: ios-dev
          cache-on-failure: true
      - name: Install XcodeGen
        if: steps.passed.outputs.found != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: End to end on the simulator
        if: steps.passed.outputs.found != 'true'
        env:
          RUNTIME: ${{ steps.keys.outputs.runtime }}
          OUTPUT: ${{ runner.temp }}/ios-dev
        run: sh tests/ios/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.passed.outputs.found != 'true'
        with:
          name: ios-dev
          path: ${{ runner.temp }}/ios-dev/
          retention-days: 14
          if-no-files-found: ignore
      - name: Record the pass of the suite
        id: record
        if: steps.passed.outputs.found != 'true'
        run: sh tests/ci/cache.sh record dev "$RUNNER_TEMP/ios-dev/passed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.record.outputs.recorded == 'true'
        with:
          name: ${{ steps.keys.outputs.dev }}
          path: ${{ runner.temp }}/passed-dev/
          retention-days: 90
          if-no-files-found: error
  android:
    name: Android unit tests and lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --target aarch64-linux-android && rustup default "$TOOLCHAIN"
      - run: cargo fetch --locked
      # src/android.rs is compiled only for Android; nothing else in CI builds it.
      - run: cargo clippy --locked --target aarch64-linux-android --lib -- -D warnings
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      # Caches Gradle's distribution and dependencies, so a slow download (a socket timeout once) is rarely needed.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The wrapper's first download of Gradle timed out twice on a runner; a fetch that retries comes first.
      - name: Fetch Gradle
        working-directory: tests/android
        run: for attempt in 1 2 3; do ./gradlew --version --no-daemon >/dev/null && exit 0; echo "attempt $attempt failed"; sleep 15; done; exit 1
      # A dependency download that fails on the network (GitHub answered 504 once) runs the build again; a failing test
      # or lint does not.
      - name: Unit tests, lint and the instrumentation APK
        working-directory: tests/android
        run: |
          set -o pipefail
          for attempt in 1 2; do
            ./gradlew :live-activity:testDebugUnitTest :live-activity:lintDebug :live-activity:assembleDebugAndroidTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" && exit 0
            grep -q -E 'Could not (GET|download|resolve)|Read timed out|status code 5[0-9][0-9]|SocketTimeoutException' "$RUNNER_TEMP/gradle.log" || exit 1
            echo "::warning title=Gradle download::attempt $attempt failed on the network"
          done
          exit 1
      - name: Verify Android minimum in the merged APK
        run: node tests/android/verify-min-sdk.mjs "$ANDROID_HOME/build-tools/37.0.0/aapt" android/build/outputs/apk/androidTest/debug/live-activity-debug-androidTest.apk
  desktop:
    name: Desktop contract (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
