name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each commit on main gets a run of its own that nothing cancels: the Publish workflow
# needs a successful main run for the exact commit of a release tag.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts the push or pull request changed. Each job below runs only for its part, so a
  # change to docs alone ends here; the run still succeeds, as the release guard needs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      js: ${{ steps.areas.outputs.js }}
      swift: ${{ steps.areas.outputs.swift }}
      android: ${{ steps.areas.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          all() { for area in rust js swift android; do echo "$area=true" >> "$GITHUB_OUTPUT"; done; echo "every part: $1"; }
          if [ "$EVENT" = workflow_dispatch ]; then all "run by hand"; exit 0; fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then all "no base to compare"; exit 0; fi
          if ! files=$(git diff --name-only "$BASE" "$HEAD"); then all "git diff failed"; exit 0; fi
          printf '%s\n' "$files"
          # The workflows and the fixtures every language reads concern every part.
          if grep -qE '^(\.github/workflows/|tests/fixtures/|contracts/)' <<< "$files"; then all "workflow or shared fixtures"; exit 0; fi
          area() { grep -qE "$2" <<< "$files" && echo "$1=true" >> "$GITHUB_OUTPUT" || echo "$1=false" >> "$GITHUB_OUTPUT"; }
          area rust '^(src/|build\.rs$|Cargo\.(toml|lock)$|permissions/|tests/[^/]+\.rs$|examples/demo/src-tauri/)'
          area js '^(guest-js/|cli/|tools/|tests/[^/]+\.mjs$|tests/release/|package(-lock)?\.json$|tsconfig\.json$|examples/demo/)'
          area swift '^(ios/|templates/ios/|tests/ios/)'
          area android '^(android/|tests/android/|Cargo\.(toml|lock)$)'
          cat "$GITHUB_OUTPUT"
  contracts:
    name: Rust, TypeScript and Swift
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.swift == 'true'
    runs-on: macos-15-intel
    env:
      RUST: ${{ needs.changes.outputs.rust }}
      JS: ${{ needs.changes.outputs.js }}
      SWIFT: ${{ needs.changes.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.JS == 'true' || env.RUST == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: env.RUST == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - if: env.RUST == 'true'
        run: rustup default 1.99.1
      - if: env.JS == 'true' || env.RUST == 'true'
        run: npm ci
      - if: env.JS == 'true'
        run: npm test && npm run typecheck && npm run build:demo
      - if: env.RUST == 'true' && env.JS != 'true'
        run: npm run build:demo
      - name: Test release guards
        if: env.JS == 'true'
        run: node --test --experimental-test-coverage --test-coverage-include=tools/release-guard.mjs --test-coverage-lines=80 --test-coverage-branches=80 --test-coverage-functions=80 tests/release/release-guard.test.mjs
      - if: env.RUST == 'true'
        run: cargo fmt --all -- --check
      - if: env.RUST == 'true'
        run: cargo fmt --manifest-path examples/demo/src-tauri/Cargo.toml -- --check
      - if: env.RUST == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - if: env.RUST == 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - if: env.RUST == 'true'
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 80
      - if: env.RUST == 'true'
        run: cargo test --locked --manifest-path examples/demo/src-tauri/Cargo.toml
      - if: env.SWIFT == 'true'
        run: bash tests/ios/run-core.sh
      - if: env.JS == 'true'
        run: npm pack --dry-run
      - if: env.RUST == 'true'
        run: cargo package --locked
  android:
    name: Android unit tests and lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: cargo fetch --locked
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: ./gradlew :live-activity:testDebugUnitTest :live-activity:lintDebug :live-activity:assembleDebugAndroidTest --no-daemon
        working-directory: tests/android
      - name: Verify Android minimum in the merged APK
        run: node tests/android/verify-min-sdk.mjs "$ANDROID_HOME/build-tools/37.0.0/aapt" android/build/outputs/apk/androidTest/debug/live-activity-debug-androidTest.apk
  desktop:
    name: Desktop contract (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: cargo test --locked
