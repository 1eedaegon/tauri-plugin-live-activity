name: Pages

# Publishes site/ to GitHub Pages (https://1eedaegon.github.io/tauri-plugin-live-activity/): the plugin's page in
# English and in Korean, its sitemap and its llms.txt, for search and answer engines. The page is static HTML that
# tests/site.test.ts keeps in step with the READMEs (TP-CI-9), so nothing is built here. It runs when a push to main
# changes the site or this workflow, and by hand (`gh workflow run pages.yml`).

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer push waits for the one under way instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
