name: LiveActivityNativeTests
options:
  bundleIdPrefix: io.github.eedaegon
  deploymentTarget:
    iOS: "16.1"
packages:
  LiveActivity:
    path: ../../../ios
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiveActivityNativeTests:
    type: application
    platform: iOS
    sources:
      - App.swift
      - LayoutScenario.swift
      - LayoutFixtures.swift
      - ../../../ios/Sources/LiveActivityCore
      - ../../../ios/Sources/LiveActivityPlugin/ActivityKitAdapter.swift
      - ../../../ios/Sources/LiveActivityPlugin/ActivityKitBackend.swift
      - ../../../ios/Sources/LiveActivityPlugin/LayoutActivityKitBackend.swift
      - ../../../ios/Sources/LiveActivityPlugin/ActionHub.swift
      - ../../../ios/Sources/LiveActivityPlugin/Reply.swift
      - ../../../templates/ios/LiveActivityActionIntent.swift
      - path: ../../fixtures/layout-requests.json
        buildPhase: resources
    dependencies:
      - package: LiveActivity
        product: LiveActivityShared
      # Only for the fixture renderer; a Tauri app links no package product.
      - package: LiveActivity
        product: LiveActivityUI
      - target: LiveActivityTestWidget
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Activity tests
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eedaegon.LiveActivityNativeTests
        TARGETED_DEVICE_FAMILY: "1"
  LiveActivityTestWidget:
    type: app-extension
    platform: iOS
    sources:
      - ../../../templates/ios/LiveActivityWidget.swift
      - ../../../templates/ios/LiveActivityActionIntent.swift
      - ../../../templates/ios/LiveActivityCustomRegistry.swift
    dependencies:
      - package: LiveActivity
        product: LiveActivityShared
      - package: LiveActivity
        product: LiveActivityUI
    info:
      path: WidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TauriLiveActivityLayout: 2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eedaegon.LiveActivityNativeTests.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  NativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LiveActivityNativeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eedaegon.LiveActivityNativeTests.uitests
        TEST_TARGET_NAME: LiveActivityNativeTests
        GENERATE_INFOPLIST_FILE: YES
