# UI tests that drive the demo app (examples/demo), installed on the same simulator, by its bundle identifier. A UI
# testing bundle needs an app of its own project to run beside, so Host is an empty app. tests/ios/run.sh runs them.
name: DemoUITests
options:
  bundleIdPrefix: io.github.eedaegon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DemoUITestsHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eedaegon.DemoUITestsHost
        TARGETED_DEVICE_FAMILY: "1"
  DemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DemoUITestsHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.eedaegon.DemoUITests
        TEST_TARGET_NAME: DemoUITestsHost
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DemoUITests:
    build:
      targets:
        DemoUITestsHost: all
        DemoUITests: [test]
    test:
      targets: [DemoUITests]
